name: Deploy React App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # 3️⃣ Build Docker image with environment variables from secret
      - name: Build React Docker image
        run: |
          docker build \
            --build-arg VITE_ENV_FILE="${{ secrets.VITE_ENV_FILE }}" \
            -t lettting/oneshop-react:latest .
          docker push lettting/oneshop-react:latest

      # 4️⃣ Set up SSH for remote deployment
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      # 5️⃣ Deploy React app via Docker Compose on server
      - name: Deploy React app via Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            cd ~/oneshop &&
            # Pull the latest image
            docker-compose -f oneshop.yml pull react &&
            # Stop existing container (ignore errors)
            docker-compose -f oneshop.yml down react || true &&
            # Start new container
            docker-compose -f oneshop.yml up -d --force-recreate --no-deps react
          "
